name: Hackathon Observatory
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, closed, ready_for_review, converted_to_draft]
  issues:
    types: [opened, closed, reopened]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  issues: read
concurrency:
  group: observstory-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build evidence-backed project map
        uses: blackmath88/observstory@2d7139ec27a32d2c690423a5159d7d919ede8c71
        with:
          config: observstory.config.json
          coordination: .observstory/coordination.json
          knowledge: .observstory/knowledge.json
          output: observstory
      - name: Build repository replay and event log
        run: python3 scripts/build_replay.py
      - name: Save dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: hackathon-observatory
          path: observstory
          retention-days: 7
      - name: Add planning links
        run: |
          echo "## Hackathon planning" >> "$GITHUB_STEP_SUMMARY"
          echo "Read [the plan](https://github.com/blackmath88/baselhack26-open-presence/blob/main/HACKATHON-PLAN.md)." >> "$GITHUB_STEP_SUMMARY"
          echo "Suggested times remain proposed until confirmed. Download this run's hackathon-observatory artifact and open index.html." >> "$GITHUB_STEP_SUMMARY"

      - name: Package public Pages site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: observstory
  deploy:
    needs: observe
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
