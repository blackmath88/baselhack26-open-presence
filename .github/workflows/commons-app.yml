name: Commons app

# Application gates for apps/commons: typecheck, tests (including the ATProto
# round trip against an isolated in-process PDS), the record-index check and
# the production build. No deployment, no network writes beyond npm.
on:
  push:
    branches: [main, 'feat/**']
    paths: ['apps/commons/**', 'sideprojects/pdf-lab/**', '.github/workflows/commons-app.yml']
  pull_request:
    paths: ['apps/commons/**', 'sideprojects/pdf-lab/**', '.github/workflows/commons-app.yml']

concurrency:
  group: commons-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run: { working-directory: apps/commons }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/commons/package-lock.json }
      - run: npm ci
      - name: Install the isolated local PDS tooling (so the round-trip tests run instead of skipping)
        run: npm ci
        working-directory: apps/commons/tools/local-pds
      - run: npm run typecheck
      - run: npm test
      - run: npm run index:check
      - run: npx vite build
      - name: CLI smoke (real local server, temp data)
        run: bash scripts/smoke/multi-entry.sh
      - name: Install Chromium for the Aurora browser checks
        run: npx playwright install --with-deps chromium
      - name: Aurora routes, interactions and real API read smoke (loopback only)
        run: OUT=$RUNNER_TEMP/aurora-smoke npm run test:aurora
      - name: PDF Lab production interactions, downloads, URL state and accessibility
        run: LAB_REPORT_DIR=$RUNNER_TEMP/pdf-lab-smoke npm run test:lab
